name: Publish to npm

# Публикует @pavelhopson/retry-http при создании GitHub Release.
# prepublishOnly (build + test) запускается автоматически на npm publish.
# Нужен секрет NPM_TOKEN (npm Automation token с правом publish).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # для npm provenance (verified badge)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}